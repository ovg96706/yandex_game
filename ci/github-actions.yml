name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax + ESM import check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install dev dependencies (jsdom)
        run: npm install --no-save jsdom
      - name: Headless smoke (real Phaser boot, all scenes, one wave)
        run: npm run smoke
      - name: Whitespace check
        run: git diff --check
      - name: Pack Yandex archive
        run: npm run pack
