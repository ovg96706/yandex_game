<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0f1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Хранитель Подземелья — защищай кристалл от волн героев" />
  <title>Хранитель Подземелья</title>
  <link rel="icon" type="image/png" href="./assets/icon-256.png" />
  <link rel="apple-touch-icon" href="./assets/icon-256.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f1020;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      touch-action: none;
      display: block;
    }

    #boot-error {
      display: none;
      max-width: 420px;
      padding: 24px;
      color: #f1dbe4;
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="boot-error">Не удалось загрузить игровой движок. Проверьте файл vendor/phaser.min.js</div>
  </div>

  <!-- Phaser 3.80.1 завендорен локально: архив Яндекс Игр не должен тянуть CDN. -->
  <script src="./vendor/phaser.min.js"></script>
  <!-- SDK платформы: относительный /sdk.js (требование архивной загрузки).
       Файл НЕ кладём в архив — его отдаёт сервер Яндекса. Локально заглушку
       подставляет tools/serve.mjs. -->
  <script src="/sdk.js"></script>
  <script>
    (function () {
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("selectstart", function (e) { e.preventDefault(); });
      document.addEventListener("dragstart", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      if (typeof Phaser === "undefined") {
        var box = document.getElementById("boot-error");
        if (box) box.style.display = "block";
      }
    })();
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
